name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build core (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - tg5040
          - tg5050
          - h700
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Build in the NextUI toolchain container
        run: make ${{ matrix.platform }}

      - name: Upload core
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/yabadabadoo_libretro.so
          if-no-files-found: error

  package:
    name: Package pak
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Download cores
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: core-*
          path: artifacts

      - name: Package
        run: |
          for dir in artifacts/core-*; do
            platform=${dir#artifacts/core-}
            mkdir -p "build/$platform"
            cp "$dir/yabadabadoo_libretro.so" "build/$platform/"
          done
          make package

      - name: Upload pak
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Yabadabadoo-pak
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Check the tag against pak.json and the submodule
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Download pak
        uses: actions/download-artifact@v8.0.2
        with:
          name: Yabadabadoo-pak
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/*.zip
            dist/*.pakz
          generate_release_notes: true
