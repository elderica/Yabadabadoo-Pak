version: 2
updates:
  # actions/checkout, upload-artifact, download-artifact and action-gh-release.
  # The yabadabadoo submodule is not here: Dependabot proposes upstream's latest commit, not a
  # release tag, so .github/workflows/upstream.yml follows upstream's releases instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
